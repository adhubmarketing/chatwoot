name: Publish Custom Docker Image to GHCR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag'
        required: false
        default: 'develop-ce'

env:
  DOCKER_REPO: ghcr.io/adhubmarketing/chatwoot

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: adhubmarketing
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set Docker Tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="develop-ce"
          fi
          echo "DOCKER_TAG=${DOCKER_REPO}:${TAG}" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.DOCKER_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image built
        run: |
          echo "✅ Image built and pushed: ${{ env.DOCKER_TAG }}"
          echo ""
          echo "Pull on your VPS with:"
          echo "  docker pull ${{ env.DOCKER_TAG }}"
